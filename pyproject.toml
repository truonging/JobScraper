[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "job-matcher"
version = "0.0.1"
description = "AI-assisted job discovery, job-fit evaluation, and resume tailoring"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
job-matcher = "job_matcher.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
